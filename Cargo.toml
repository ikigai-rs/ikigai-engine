[workspace]
resolver = "2"
members = ["crates/*"]

# ikigai-resolve, ikigai-engine and ikigai-intray left the ikigai-cli workspace with their
# history (ledger #2316). They released there in lockstep with the `ikigai` binary, and that
# made a cycle at the REPO level: the cli links modules whose tests dev-depend on these
# crates, so no order of publishes could move the ecosystem to a new core. Between the
# CRATES there is no cycle, and none of the three depends on a module the cli embeds.
#
# The three still release together, at one version: engine and intray take resolve by path
# AND version, and intray's tests take the engine the same way.
[workspace.package]
# 0.1.70 is the first release from this repository: the next number after cli's lockstep
# 0.1.69, and new, since engine and intray changed after `ikigai-cli-v0.1.69` (the
# `run <spec>` → `execute <spec>` rename, ikigai-rs/ikigai-cli#585, ledger #104; intray's
# reencoded settled stages, a file mode and the tuple id on decode, ikigai-rs/ikigai-cli#579,
# ledger #2126).
# 0.2.0 (ledger #2349): the re-pin onto ikigai-core 0.2.0. Core's types are in all three
# crates' APIs, so linking a new core is a breaking change for their consumers: the next minor.
# 0.2.1 (ledger #2286): a pipe hands an incremental stage its upstream by reference
# (`content=<iri>`), so the stage reads the body as it comes. Internal, no public type changed:
# a patch.
# 0.2.2 (ledger #2287): a mount forwards `invoke_body`, so a peer's streamed answer passes
# through it uncollected; `Resolver` gains the defaulted `issue_body_as_in_run`. Additive: a
# patch, for all three in lockstep.
# Ledger #2286 part 2 ships within 0.2.2, which was not yet published when it landed
# (crates.io had 0.2.1 on 2026-10-28): a pipe attaches a stage's body to the next stage, and
# `Resolver` gains the defaulted `issue_attached_in` / `issue_body_attached_in`. Additive.
# 0.2.3 (ledger #2502): a `source` word that names an argument the contract does not declare
# (`toUpper inn=abc`) is refused, naming the declared arguments, instead of being sent as
# positional text. The REPL help always promised this. A line that relied on the old fallback
# now names the argument (`in="a=b"`); no public type changed, so a patch.
# 0.2.4 (ledger #2507): plan-eval declares open arguments so named plan parameters
# reach the runner, which still refuses undeclared names. A contract fix: a patch.
# 0.2.5 (ledger #2508): an unquoted `key=<iri>` sends `ArgRef::Reference`, settled by the
# target's contract in ikigai-core 0.2.5, and `plan` renders it `ik:ref <iri>`; a quoted
# `key="<iri>"` stays text. No public type changed: a patch, on the raised core floor.
# 0.2.6 (ledger #2509): `bind` / `unbind` write a named request into the host's names atom
# (`Engine::with_names_atom`), and `ikigai_engine::names` is the names text form with its
# lossless Turtle transreptor pair (`plan-reader`). Additive, on core 0.2.6's named requests
# (`TopologyRule::named_request`, `AliasTable::with_rule`): a patch.
# 0.2.7 (ledger #2510): a pipeline on the right of `bind` is bound as its plan, `source
# urn:plan:eval` with the plan inline, so the name is a live composite. No public type
# changed: a patch.
# 0.2.8 (ledger #2485, the engine half of the `.iki` script format): a `#` comment line is
# skipped, `ikigai_engine::script` and `Engine::run_script` run a script of REPL lines with
# declared `# @param` parameters and stop at the first failing line, and `execute <plan>
# key=value` passes `key=value` to the plan's parameters. Additive: a patch.
# 0.2.9 (ledger #2653): refuse unsupported mapOver, forkOf and binds on stored forks
# rather than silently dropping them; and (ledger #2656) plan-requires includes fixed named
# plans recursively, refusing cycles and nesting beyond 16 named plans. No public type
# changed: a patch.
# 0.2.10 (ledger #2654): the plan face renders, reads, runs and binds a mapped fork
# (`a .. ( b ; c )`), a fork as a fork's branch, and a fork that binds its join, which 0.2.9
# refused; each item of a mapped fork is its own request. Raises ikigai-vocab to 0.2.8, whose
# shapes take them. No public type changed: a patch.
# 0.2.11 (ledger #2655): refuse stored plans whose result never reaches a Sink or Delete,
# and warn on unreached reads. A validator correction; no public type changed: a patch.
# 0.2.12 (ledger #2667): take vocab 0.2.9's fixed fork binding shapes, so a later
# step can cite a fork's join through plan-eval and a bound name; and (ledger #2660) a
# mounted peer's answer reports the `mounted` uncached reason, on core 0.2.9. A patch.
version = "0.2.12"
edition = "2021"
# Measured 2026-10-26, not assumed: 1.89 is the first toolchain that builds the workspace.
# `ikigai-intray` takes the lease with `std::fs::File::try_lock` (stable in 1.89; 1.88 refuses
# it as the unstable `file_lock`), and below that `encoding_rs` 0.8.42 requires 1.88.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-engine"
homepage = "https://github.com/ikigai-rs/ikigai-engine"

# Every external entry below is the same requirement ikigai-cli's root declares (copied at
# ikigai-cli 94e0a73, 2026-10-26), so the crates resolve here what they resolved there, until
# the core 0.2.0 re-pin sweep (ledger #2261, wave 4, ledger #2349) moved the ikigai entries on.
# cli's root carries the full history of each floor; the comments here keep the part that binds
# THESE crates.
[workspace.dependencies]
# 0.2.0 is the streams release (ledger #2261), taken by the re-pin sweep (wave 4, ledger #2349).
# The old pin, "0.1.108", meant <0.2.0 under 0.x rules, so a crate on it could not share a core
# with an ecosystem on 0.2. Every floor below was reached on 0.1 and 0.2.0 carries them all.
# `ikigai-fs` 0.2.2 requires ^0.2.1, so the workspace resolves 0.2.1.
# 0.1.108 = the failure classes (ledger #1546): `FailureClass`, `Error::class()`, the
# `RetryAfter` / `OverBudget` / `Refused` / `Unsupported` variants, `ActionSpec::fails` and the
# run context (`IssueContext`, `Kernel::issue_with_context`). An API floor for `ikigai-resolve`.
# Beneath it, each still binding here:
# - 0.1.107: the cache-status probe (`Kernel::is_cached`) keys a served name without resolving
#   it; `ikigai-resolve`'s `the_cache_probe_asks_a_mounts_peer_once_per_resolver_read` pins it.
# - 0.1.106: the ArgSpec shape (ledger #1547). The engine routes by `pipe_slots` /
#   `excluded_by_groups` and joins repeats with `join_repeats`.
# - 0.1.89: `space_iri` / `SPACE_PREFIX`, which `plan_space::space()` names itself with.
# - 0.1.87: `urn:kernel:explain` and `urn:kernel:dependents`; the engine's `explain`, `why` and
#   `dependents` are thin views over them, and its tests source both.
# - 0.1.75: the temporal corridor (`Scope::with_named_at`), which `as-of=` injects per request.
# - 0.1.64: `Resolved.canonical` (no default in a struct literal, so a hard floor).
# - 0.1.60: `Spawner::width()`, which the engine's fan-out routing reads; the method is
#   defaulted, so an older core compiles and silently answers width 1.
# 0.2.3 (ledger #2286, part 2) is the API floor for `BodyIssue` (`Kernel::issue_with` /
# `issue_body_with`, a body attached to a pipe stage) and `ArgSpec::reads_body`.
# 0.2.5 (K1, core PR 265) is the BEHAVIOR floor for `key=<iri>` (ledger #2508): the kernel
# settles an `ArgRef::Reference` by the target's contract (a by-value input gets the
# referent's bytes, an `xsd:anyURI` input the IRI, a `reads_body` input the reference).
# Below it a by-value input would be handed a reference it cannot read inline.
# 0.2.6 (K2, ledger #2512/#2513) is the API floor for named requests: `TopologyRule::named_request`
# / `named_template`, `FixedArgument`, `AliasTable::with_rule`, which `bind` and the names text
# form build rules with (ledger #2509).
# 0.2.9 (core PR 277, ledger #2660) is the API floor for
# `Representation::with_uncached_reason(UncachedReason::Mounted)`: peer cuts do not
# reach this kernel, so forwarded answers report `mounted` rather than `declared`.
# 0.2.10 (ledger #2671/#2619) is the API floor for `FixedValue::ReferenceTemplate`
# and `FixedArgument::reference_template`: captures in a fixed reference are percent-encoded.
# ⚠ `^0.2.10` is also a ceiling below 0.3.0.
ikigai-core = "0.2.10"
# Raised with core, in lockstep. 0.1.70 is the first version carrying the PROCESS vocabulary
# (`ik:Process`/`ik:Step`/`ik:Argument`/`ik:Fork`, the plan shapes in `SHAPES`, and the
# `ikigai_vocab::plan` IRI builders) that the engine's `plan.rs` renders and reads; the tests
# validate against the vocabulary the resolve picks.
# 0.2.0 is the streams release (ledger #2261), in lockstep with core; the old "0.1.108" pin
# meant <0.2.0 under 0.x rules. ⚠ `^0.2.0` is also a ceiling below 0.3.0.
# 0.2.8 (ledger #2654) is the first whose shapes take ik:mapOver, ik:forkOf and ik:binds on
# an ik:Fork (ik:Stage, ledger #32), which the engine now renders and `urn:plan:validate`
# checks against these shapes.
# 0.2.9 (ledger #2667, core PR 279) fixes process:local-refs so a fork's binding
# counts when a later step cites its join. Required by plan-eval, which validates first.
ikigai-vocab = "0.2.9"
# Dev-dependency of the engine (its end-to-end tests mount the real file module). 0.1.8 is a
# SECURITY floor (audit round 3, ledger #856): the jail authorizes the file it actually opens.
# 0.2.2 is the newest release and the one on core 0.2 (ledger #2349); it carries that floor.
ikigai-fs = "0.2.2"
# Dev-dependency of the engine: every rendered `ik:Process` graph is validated against the
# published shapes. Default features stay on, so the validator is rudof, as on a cli host.
# 0.3.4 is a SECURITY floor (ledger #1326) and 0.3.6 was cli's pin. 0.5.0 is the newest
# release and the one on core 0.2 (ledger #2349). `"0.5.0"` is `<0.6.0`.
ikigai-shacl = "0.5.0"
ikigai-resolve = { path = "crates/ikigai-resolve", version = "0.2.12" }
futures = "0.3"
# Turtle parsing for the engine's plan face, reading a stored `ik:Process` graph back.
# Default features only: no tokio, so `ikigai-engine` still compiles to wasm. oxttl pins
# `oxrdf = "=0.3.4"` and re-exports none of its types, so the oxrdf pin is that version
# exactly: a looser one would resolve a second oxrdf that oxttl's triples are not from.
oxttl = "0.2.4"
oxrdf = "0.3.4"
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Map` keep insertion order. In ikigai-cli it keeps a
# declared contract's inputs in their authored order wherever this workspace's JSON reaches a
# person or an agent; it is kept here so these crates build with the same `serde_json` the cli
# links, and their tests see the order the host produces.
serde_json = { version = "1", features = ["preserve_order"] }
